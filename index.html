<script>
// ================== КОНФИГ ==================
const CONFIG = {
  DEMO_ID: 123456789,
  AUTO_CHECK_MIN: 10,
};

// ================== USER ID ==================
let userId = CONFIG.DEMO_ID;

// ================== ХЕЛПЕРЫ ==================
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function toast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2200);
}
function fmtTime(sec){
  return String(Math.floor(sec/3600)).padStart(2,'0')+':'+
         String(Math.floor((sec%3600)/60)).padStart(2,'0')+':'+
         String(sec%60).padStart(2,'0');
}
function fmtBytes(b){
  if (b < 1024) return b+' B';
  if (b < 1048576) return (b/1024).toFixed(1)+' KB';
  if (b < 1073741824) return (b/1048576).toFixed(1)+' MB';
  return (b/1073741824).toFixed(2)+' GB';
}

// ================== СЕРВЕРЫ ==================
const SERVERS = [
  { dev:'igareck', name:'BLACK_SS+All_RUS',   flag:'🌍', region:'Россия', url:'https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_SS%2BAll_RUS.txt' },
  { dev:'igareck', name:'BLACK_SS_WEAK_DPI',  flag:'🌍', region:'Россия', url:'https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_SS_WEAK_DPI_RUS.txt' },
  { dev:'igareck', name:'BLACK_VLESS_RUS',    flag:'🌍', region:'Россия', url:'https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS.txt' },
  { dev:'igareck', name:'BLACK_VLESS_mobile', flag:'📱', region:'Россия', url:'https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS_mobile.txt' },
  { dev:'igareck', name:'VLESS Reality Mobile', flag:'⚡', region:'Россия', url:'https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/Vless-Reality-White-Lists-Rus-Mobile.txt' },
  { dev:'igareck', name:'WHITE-CIDR-all',     flag:'⚪', region:'Россия', url:'https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/WHITE-CIDR-RU-all.txt' },
  { dev:'igareck', name:'WHITE-CIDR-checked', flag:'✅', region:'Россия', url:'https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/WHITE-CIDR-RU-checked.txt' },
  { dev:'igareck', name:'WHITE-SNI-all',      flag:'⚪', region:'Россия', url:'https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/WHITE-SNI-RU-all.txt' },
  { dev:'rjsxrd', name:'Все серверы', flag:'🌐', region:'Мир', url:'https://raw.githubusercontent.com/whoahaow/rjsxrd/main/bypass/bypass-all.txt' },
  { dev:'rjsxrd', name:'Обход 1', flag:'1️⃣', region:'Мир', url:'https://raw.githubusercontent.com/whoahaow/rjsxrd/main/bypass/bypass-1.txt' },
  { dev:'rjsxrd', name:'Обход 2', flag:'2️⃣', region:'Мир', url:'https://raw.githubusercontent.com/whoahaow/rjsxrd/main/bypass/bypass-2.txt' },
  { dev:'rjsxrd', name:'Обход 3', flag:'3️⃣', region:'Мир', url:'https://raw.githubusercontent.com/whoahaow/rjsxrd/main/bypass/bypass-3.txt' },
  { dev:'rjsxrd', name:'Обход 4', flag:'4️⃣', region:'Мир', url:'https://raw.githubusercontent.com/whoahaow/rjsxrd/main/bypass/bypass-4.txt' },
  { dev:'rjsxrd', name:'Обход 5', flag:'5️⃣', region:'Мир', url:'https://raw.githubusercontent.com/whoahaow/rjsxrd/main/bypass/bypass-5.txt' },
  { dev:'zieng2', name:'LITE',      flag:'💡', region:'Мир', url:'https://raw.githubusercontent.com/zieng2/wl/main/vless_lite.txt' },
  { dev:'zieng2', name:'UNIVERSAL', flag:'💎', region:'Мир', url:'https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt' },
];

// ================== КЛИЕНТЫ ==================
const CLIENTS = {
  happ: {
    name: 'Happ',
    androidPackages: ['com.happproxy', 'su.happ.proxyutility'],
    schemes: url => {
      const enc = encodeURIComponent(url);
      return [
        'happ://add/' + enc,
        'happ://import?url=' + enc,
      ];
    },
    stores: {
      android: 'https://play.google.com/store/apps/details?id=com.happproxy',
      ios: 'https://apps.apple.com/ru/app/happ-proxy-utility/id673623643'
    }
  },
  v2rayng: {
    name: 'v2rayNG',
    androidPackages: ['com.v2ray.ang'],
    schemes: url => {
      const enc = encodeURIComponent(url);
      return [
        'v2rayng://install-sub?url=' + enc,
        'v2rayng://install-config?url=' + enc,
      ];
    },
    stores: {
      android: 'https://github.com/2dust/v2rayNG/releases/latest',
      ios: null
    }
  },
  hiddify: {
    name: 'Hiddify',
    androidPackages: ['app.hiddify.com'],
    schemes: url => {
      let b64 = '';
      try { b64 = btoa(unescape(encodeURIComponent(url))).replace(/=+$/,''); } catch(e){}
      return [
        'hiddify://import/' + b64,
        'hiddify://import?url=' + encodeURIComponent(url),
      ];
    },
    stores: {
      android: 'https://play.google.com/store/apps/details?id=app.hiddify.com',
      ios: 'https://apps.apple.com/app/hiddify-proxy-vpn/id6596777532'
    }
  }
};

// ================== СОСТОЯНИЕ ==================
const state = {
  currentServer: null,
  connected: false,
  connectStart: 0,
  timerId: null,
  autoCheckTimer: null,
  autoCheckEnabled: true,
  theme: 'auto',
  client: 'happ',
  pingResults: {},
  favorites: [],
  filterTab: 'all',
  search: '',
};

try {
  state.favorites = JSON.parse(localStorage.getItem('favs') || '[]');
  state.theme = localStorage.getItem('theme') || 'auto';
  state.client = localStorage.getItem('client') || 'happ';
  state.autoCheckEnabled = localStorage.getItem('autoCheck') !== '0';
  const saved = localStorage.getItem('curServer');
  if (saved) state.currentServer = JSON.parse(saved);
} catch(e){}

// ================== ПИНГ ==================
async function pingServer(server){
  const start = Date.now();
  try {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 5000);
    await fetch(server.url + '?t=' + Date.now(), {
      method:'GET', signal: ctrl.signal, cache:'no-store', mode:'no-cors'
    });
    clearTimeout(to);
    return Date.now() - start;
  } catch(e){ return 9999; }
}

async function pingAll(){
  toast('Проверка скорости...');
  await Promise.all(SERVERS.map(async s => {
    const ms = await pingServer(s);
    state.pingResults[s.url] = ms;
    renderServers();
    return ms;
  }));
  const fastest = getFastestServer();
  if (fastest) toast('Быстрейший: ' + fastest.name);
  else toast('Не удалось определить');
  renderServers();
}

function getFastestServer(){
  let best = null, bestMs = Infinity;
  SERVERS.forEach(s => {
    const ms = state.pingResults[s.url];
    if (ms && ms < bestMs){ bestMs = ms; best = s; }
  });
  return best;
}

// ================== UI ==================
function renderServers(){
  const box = document.getElementById('serversContainer');
  if (!box) return;
  const filtered = SERVERS.filter(s => {
    if (state.filterTab === 'fav' && !state.favorites.includes(s.url)) return false;
    if (state.search && !s.name.toLowerCase().includes(state.search.toLowerCase())) return false;
    return true;
  });
  const groups = {};
  filtered.forEach(s => {
    if (!groups[s.dev]) groups[s.dev] = [];
    groups[s.dev].push(s);
  });
  box.innerHTML = '';
  ['igareck','rjsxrd','zieng2'].forEach(dev => {
    if (!groups[dev]) return;
    const g = document.createElement('div');
    g.className = 'group';
    let html = '<div class="grp-title">' + dev + '</div>';
    groups[dev].forEach(s => {
      const isSel = state.currentServer && state.currentServer.url === s.url;
      const ms = state.pingResults[s.url];
      let pingText = '—', pingCls = '';
      if (ms === 9999) { pingText = 'offline'; pingCls = 'slow'; }
      else if (ms) { pingText = ms + ' мс'; pingCls = ms < 400 ? 'fast' : ms < 1500 ? '' : 'slow'; }
      html += '<div class="server-item ' + (isSel?'selected':'') + '" data-url="' + s.url + '">' +
        '<div class="ico-server">' + s.flag + '</div>' +
        '<div class="info"><div class="name">' + s.name + '</div>' +
        '<div class="meta">' + s.region + '</div></div>' +
        '<div class="ping ' + pingCls + '">' + pingText + '</div></div>';
    });
    g.innerHTML = html;
    box.appendChild(g);
  });
  box.querySelectorAll('.server-item').forEach(el => {
    el.addEventListener('click', () => {
      const s = SERVERS.find(x => x.url === el.dataset.url);
      if (s) selectServer(s);
    });
  });
}

function selectServer(s){
  state.currentServer = s;
  try { localStorage.setItem('curServer', JSON.stringify(s)); } catch(e){}
  updateMainUI();
  renderServers();
  toast('Выбран: ' + s.name);
}

function updateMainUI(){
  if (state.currentServer){
    document.getElementById('curFlag').textContent = state.currentServer.flag;
    document.getElementById('curServerName').textContent = state.currentServer.name;
    document.getElementById('curServerSub').textContent = state.currentServer.dev + ' · ' + state.currentServer.region;
    document.getElementById('regionName').textContent = state.currentServer.region;
    document.getElementById('regionFlag').textContent = state.currentServer.flag;
  }
  const pill = document.getElementById('statusPill');
  const btn = document.getElementById('connectBtn');
  const btnTxt = document.getElementById('connectBtnText');
  if (state.connected){
    pill.classList.add('connected');
    document.getElementById('statusText').textContent = 'Соединение защищено!';
    btn.classList.add('disconnect');
    btnTxt.textContent = 'Отключиться';
  } else {
    pill.classList.remove('connected');
    document.getElementById('statusText').textContent = 'Отключено';
    btn.classList.remove('disconnect');
    btnTxt.textContent = 'Подключиться';
  }
  const badge = document.getElementById('clientBadge');
  if (badge) badge.textContent = CLIENTS[state.client]?.name || 'Happ';
  document.querySelectorAll('.client-opt').forEach(el => {
    el.classList.toggle('active', el.dataset.client === state.client);
  });
}

// ================== ОТКРЫТИЕ КЛИЕНТА (С ПРОМЕЖУТОЧНОЙ КНОПКОЙ) ==================
function buildConfigUrl(server){
  return server.url + (server.url.includes('?') ? '&' : '?') + 'user=' + userId;
}

function tryOpenClient(server){
  const client = CLIENTS[state.client];
  if (!client){ toast('Клиент не выбран'); return; }
  const configUrl = buildConfigUrl(server);

  // Показываем промежуточную модалку с кнопкой
  showOpenModal(client, configUrl);
}

function showOpenModal(client, configUrl){
  const modalText = document.getElementById('modalText');
  const modalButtons = document.getElementById('modalButtons');
  const modalTitle = document.getElementById('modalTitle');

  modalTitle.textContent = 'Открыть ' + client.name;
  modalText.textContent = 'Нажмите кнопку ниже, чтобы добавить конфигурацию в ' + client.name + '.';

  modalButtons.innerHTML = '';

  // Кнопка "Открыть"
  const openBtn = document.createElement('button');
  openBtn.className = 'btn-primary';
  openBtn.textContent = '🚀 Открыть ' + client.name;
  openBtn.onclick = () => {
    // Прямой клик пользователя — Chrome разрешит переход
    const schemes = client.schemes(configUrl);
    // Пробуем первую схему
    window.location.href = schemes[0];
    // Закрываем модалку через секунду
    setTimeout(() => {
      hideModal();
      // Помечаем подключённым
      state.connected = true;
      state.connectStart = Date.now();
      updateMainUI();
      startTimer();
      startStats();
      document.getElementById('connectBtn').disabled = false;
      toast('Готово! Разрешите VPN в клиенте.');
    }, 1000);
  };
  modalButtons.appendChild(openBtn);

  // Кнопка "Скопировать ссылку"
  const copyBtn = document.createElement('button');
  copyBtn.className = 'btn-secondary';
  copyBtn.textContent = '📋 Скопировать ссылку';
  copyBtn.onclick = () => {
    if (navigator.clipboard){
      navigator.clipboard.writeText(configUrl).then(() => {
        toast('Ссылка скопирована. Вставьте её в ' + client.name + '.');
      });
    } else {
      const ta = document.createElement('textarea');
      ta.value = configUrl;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast('Скопировано'); } catch(e){}
      document.body.removeChild(ta);
    }
  };
  modalButtons.appendChild(copyBtn);

  // Кнопка "Установить"
  if (client.stores.android || client.stores.ios){
    const installBtn = document.createElement('a');
    installBtn.className = 'btn-secondary';
    installBtn.textContent = '⬇️ Установить ' + client.name;
    installBtn.href = client.stores.android || client.stores.ios;
    installBtn.target = '_blank';
    modalButtons.appendChild(installBtn);
  }

  // Кнопка "Закрыть"
  const closeBtn = document.createElement('button');
  closeBtn.className = 'btn-secondary';
  closeBtn.textContent = 'Закрыть';
  closeBtn.onclick = hideModal;
  modalButtons.appendChild(closeBtn);

  document.getElementById('modalBg').classList.add('show');
}

function hideModal(){
  document.getElementById('modalBg').classList.remove('show');
}

// ================== ПОДКЛЮЧЕНИЕ ==================
function connect(){
  if (!state.currentServer){ toast('Выберите сервер'); return; }
  document.getElementById('connectBtn').disabled = true;
  tryOpenClient(state.currentServer);
}

function disconnect(){
  state.connected = false;
  updateMainUI();
  stopTimer();
  stopStats();
  toast('Отключено');
}

function startTimer(){
  stopTimer();
  state.timerId = setInterval(() => {
    const s = Math.floor((Date.now() - state.connectStart) / 1000);
    document.getElementById('activeTime').textContent = fmtTime(s);
  }, 1000);
}
function stopTimer(){
  if (state.timerId) clearInterval(state.timerId);
  state.timerId = null;
}

let statsInterval = null;
let bytesDown = 0, bytesUp = 0;
function startStats(){
  bytesDown = 0; bytesUp = 0;
  stopStats();
  statsInterval = setInterval(() => {
    const down = Math.random() * 2.2 * 1024 * 1024;
    const up = Math.random() * 80 * 1024;
    bytesDown += down; bytesUp += up;
    document.getElementById('statDown').textContent = fmtBytes(down) + '/s';
    document.getElementById('statUp').textContent = fmtBytes(up) + '/s';
    document.getElementById('statTotal').textContent = fmtBytes(bytesDown + bytesUp);
  }, 1000);
}
function stopStats(){
  if (statsInterval) clearInterval(statsInterval);
  statsInterval = null;
  document.getElementById('statDown').textContent = '0 B/s';
  document.getElementById('statUp').textContent = '0 B/s';
  document.getElementById('statTotal').textContent = '0 B';
}

function startAutoCheck(){
  stopAutoCheck();
  if (!state.autoCheckEnabled) return;
  state.autoCheckTimer = setInterval(async () => {
    await pingAll();
    const fastest = getFastestServer();
    if (fastest && (!state.currentServer || state.currentServer.url !== fastest.url)){
      selectServer(fastest);
      toast('Авто: выбран быстрейший');
    }
  }, CONFIG.AUTO_CHECK_MIN * 60 * 1000);
}
function stopAutoCheck(){
  if (state.autoCheckTimer) clearInterval(state.autoCheckTimer);
  state.autoCheckTimer = null;
}

// ================== НАВИГАЦИЯ ==================
function go(page){
  $$('.page').forEach(p => p.classList.remove('active'));
  const el = document.getElementById('page-' + page);
  if (el) el.classList.add('active');
  $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === page));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
$$('.nav-item').forEach(n => n.addEventListener('click', () => go(n.dataset.page)));
document.getElementById('backFromServers').addEventListener('click', () => go('vpn'));
document.getElementById('serverSelectBtn').addEventListener('click', () => go('servers'));

// ================== ФИЛЬТРЫ ==================
$$('.segment button').forEach(b => {
  b.addEventListener('click', () => {
    $$('.segment button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.filterTab = b.dataset.tab;
    renderServers();
  });
});
document.getElementById('searchInput').addEventListener('input', e => {
  state.search = e.target.value;
  renderServers();
});

// ================== БЫСТРЕЙШИЙ ==================
document.getElementById('fastestItem').addEventListener('click', async () => {
  document.getElementById('fastestMeta').innerHTML = '<span class="loader"></span> Измеряем...';
  await pingAll();
  const fastest = getFastestServer();
  if (fastest){
    const ms = state.pingResults[fastest.url];
    document.getElementById('fastestMeta').textContent = fastest.name + ' · ' + ms + ' мс';
    selectServer(fastest);
  } else {
    document.getElementById('fastestMeta').textContent = 'Не удалось';
  }
});

// ================== КНОПКА ПОДКЛЮЧЕНИЯ ==================
document.getElementById('connectBtn').addEventListener('click', () => {
  if (state.connected) disconnect();
  else connect();
});

// ================== НАСТРОЙКИ ==================
document.getElementById('myId').textContent = userId;
document.getElementById('copyIdBtn').addEventListener('click', () => {
  if (navigator.clipboard) navigator.clipboard.writeText(String(userId)).then(() => toast('ID скопирован'));
});

document.querySelectorAll('.client-opt').forEach(el => {
  el.addEventListener('click', () => {
    state.client = el.dataset.client;
    try { localStorage.setItem('client', state.client); } catch(e){}
    updateMainUI();
    toast('Клиент: ' + CLIENTS[state.client].name);
  });
});

document.getElementById('themeBtn').addEventListener('click', () => {
  const modes = ['auto','light','dark'];
  let i = (modes.indexOf(state.theme) + 1) % modes.length;
  state.theme = modes[i];
  applyTheme();
  try { localStorage.setItem('theme', state.theme); } catch(e){}
});

function applyTheme(){
  let mode = state.theme;
  if (mode === 'auto'){
    mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', mode);
  const val = document.getElementById('themeVal');
  if (val) val.textContent = {auto:'Авто',light:'Светлая',dark:'Тёмная'}[state.theme];
}

document.getElementById('autoCheckSw').addEventListener('click', e => {
  state.autoCheckEnabled = !state.autoCheckEnabled;
  e.currentTarget.classList.toggle('on', state.autoCheckEnabled);
  try { localStorage.setItem('autoCheck', state.autoCheckEnabled ? '1' : '0'); } catch(e){}
  if (state.autoCheckEnabled) { startAutoCheck(); toast('Автопроверка вкл'); }
  else { stopAutoCheck(); toast('Автопроверка выкл'); }
});

document.getElementById('supportBtn').addEventListener('click', () => {
  window.open('https://t.me/TerchVPN_support', '_blank');
});

document.getElementById('modalBg').addEventListener('click', e => {
  if (e.target.id === 'modalBg') hideModal();
});

// ================== INIT ==================
function init(){
  try {
    applyTheme();
    document.getElementById('autoCheckSw').classList.toggle('on', state.autoCheckEnabled);
    renderServers();
    updateMainUI();
    if (state.autoCheckEnabled){
      setTimeout(() => { pingAll().then(startAutoCheck); }, 3000);
    }
  } catch(e){ console.error('Init error:', e); }

  setTimeout(() => {
    const sp = document.getElementById('splash');
    if (sp) sp.classList.add('hide');
    setTimeout(() => { if (sp) sp.style.display = 'none'; }, 250);
  }, 150);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
